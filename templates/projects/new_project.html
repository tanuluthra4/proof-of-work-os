{% extends 'base.html' %}
{% from '_macros.html' import csrf %}
{% block title %}New project{% endblock %}
{% block content %}
<div class="card" style="max-width:640px;margin:0 auto">
    <h2>Create new project</h2>
    <form method="post">
        {{ csrf() }}
        <label for="title">Title</label>
        <input id="title" type="text" name="title" value="{{ form.get('title', '') }}" required maxlength="200">

        <label for="description">Description (optional)</label>
        <textarea id="description" name="description" maxlength="2000">{{ form.get('description', '') }}</textarea>

        <label for="status">Status</label>
        <select id="status" name="status">
            {% for s in statuses %}<option value="{{ s }}" {{ 'selected' if form.get('status') == s }}>{{ s }}</option>{% endfor %}
        </select>

        <label for="start_date">Start date</label>
        <input id="start_date" type="date" name="start_date" value="{{ form.get('start_date', '') }}">
        <label for="end_date">End date</label>
        <input id="end_date" type="date" name="end_date" value="{{ form.get('end_date', '') }}">

        <label for="github_url">GitHub repository URL</label>
        <input id="github_url" type="url" name="github_url" value="{{ form.get('github_url', '') }}">
        <label for="live_url">Live project URL</label>
        <input id="live_url" type="url" name="live_url" value="{{ form.get('live_url', '') }}">

        <div class="actions-row">
            <button type="submit" class="btn-primary">Create project</button>
            <a class="btn btn-ghost" href="{{ url_for('projects.projects') }}">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
